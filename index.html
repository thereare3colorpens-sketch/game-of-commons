<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위대한 전환</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Distort';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/Distort-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: white; }
        .font-title { font-family: 'Distort', sans-serif; }
        
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-1deg); }
            75% { transform: translateX(10px) rotate(1deg); }
        }
        .shake-screen { animation: shake 0.5s ease-in-out; border: 8px solid #ef4444; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. 초기 화면 (역할 선택) -->
    <div id="panel-home" class="w-full max-w-2xl text-center">
        <h1 class="text-7xl font-title text-emerald-400 mb-4">위대한 전환</h1>
        <p class="text-xl text-slate-300 mb-12">모두가 풍요로운 생태 문명으로 나아갈 수 있을까요?</p>
        <div class="grid grid-cols-2 gap-6">
            <button onclick="showPanel('panel-teacher-setup')" class="bg-indigo-600 hover:bg-indigo-500 p-8 rounded-xl font-bold text-2xl transition">
                🖥️ 진행자 (교사용)
            </button>
            <button onclick="showPanel('panel-student-login')" class="bg-slate-700 hover:bg-slate-600 p-8 rounded-xl font-bold text-2xl transition">
                📱 참여자 (디벗 접속)
            </button>
        </div>
    </div>

    <!-- 2. 교사용 방 개설 화면 -->
    <div id="panel-teacher-setup" class="w-full max-w-md hidden text-center">
        <h2 class="text-4xl font-title text-indigo-400 mb-8">수업 방 개설</h2>
        <input type="text" id="input-room-name" placeholder="방 이름 (예: 1반)" class="w-full p-4 mb-4 rounded-lg bg-slate-800 border border-slate-600 text-xl text-center">
        <input type="number" id="input-team-count" placeholder="모둠 수 (예: 6)" min="2" max="10" class="w-full p-4 mb-8 rounded-lg bg-slate-800 border border-slate-600 text-xl text-center">
        <button id="btn-create-room" class="w-full bg-indigo-600 hover:bg-indigo-500 p-4 rounded-lg font-bold text-xl">개설하기</button>
    </div>

    <!-- 3. 학생용 접속 화면 -->
    <div id="panel-student-login" class="w-full max-w-md hidden text-center">
        <h2 class="text-4xl font-title text-slate-300 mb-8">모둠 접속</h2>
        <input type="text" id="student-room-name" placeholder="선생님이 알려준 방 이름" class="w-full p-4 mb-4 rounded-lg bg-slate-800 border border-slate-600 text-xl text-center">
        <input type="number" id="student-team-num" placeholder="우리 모둠 번호 (숫자만)" class="w-full p-4 mb-8 rounded-lg bg-slate-800 border border-slate-600 text-xl text-center">
        <button id="btn-join-room" class="w-full bg-emerald-600 hover:bg-emerald-500 p-4 rounded-lg font-bold text-xl">입장하기</button>
    </div>

    <!-- 4. 교사용 대시보드 (메인 스크린) -->
    <div id="panel-dashboard" class="w-full max-w-7xl hidden flex-col items-center">
        <div class="w-full flex justify-between items-center mb-6 px-4">
            <div class="text-2xl font-bold text-slate-400">방: <span id="display-room-name" class="text-white"></span></div>
            <div class="text-3xl font-title text-emerald-400">제 <span id="display-round">1</span> 라운드</div>
            <div id="narrative-text" class="text-xl bg-slate-800 px-6 py-2 rounded-full text-yellow-300 font-bold">모둠의 선택을 기다립니다...</div>
        </div>
        
        <!-- 공유지 HP 바 -->
        <div class="w-full max-w-4xl bg-slate-800 h-12 rounded-full mb-10 overflow-hidden border-2 border-slate-600 relative">
            <div id="hp-bar" class="h-full bg-emerald-500 transition-all duration-1000" style="width: 100%;"></div>
            <div class="absolute inset-0 flex items-center justify-center font-bold text-xl drop-shadow-md">공유지 체력: <span id="hp-text">100</span> / 100</div>
        </div>

        <div id="team-cards-container" class="w-full grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-8">
            <!-- 자바스크립트로 카드 자동 생성 -->
        </div>

        <button id="btn-reveal" class="hidden bg-red-600 hover:bg-red-500 px-8 py-4 rounded-full font-bold text-2xl shadow-lg transition">결과 동시 공개!</button>
        <button id="btn-next-round" class="hidden bg-indigo-600 hover:bg-indigo-500 px-8 py-4 rounded-full font-bold text-2xl shadow-lg transition">다음 라운드 준비</button>
    </div>

    <!-- 5. 학생용 리모컨 (행동 선택) -->
    <div id="panel-remote" class="w-full max-w-md hidden text-center flex-col items-center justify-center h-screen pb-20">
        <h2 class="text-3xl font-bold mb-2"><span id="remote-team-name" class="text-emerald-400"></span> 접속됨</h2>
        <p class="text-slate-400 mb-8">이번 라운드의 행동을 선택하세요.</p>
        
        <div id="remote-buttons" class="w-full grid gap-4">
            <button onclick="submitAction('greed')" class="bg-red-900 border-2 border-red-500 p-6 rounded-2xl text-2xl font-bold hover:bg-red-800">
                😈 욕심내기<br><span class="text-sm text-red-300 font-normal">나만 +5💰 / 숲 -15🌿</span>
            </button>
            <button onclick="submitAction('need')" class="bg-amber-900 border-2 border-amber-500 p-6 rounded-2xl text-2xl font-bold hover:bg-amber-800">
                ⛏️ 적당히<br><span class="text-sm text-amber-300 font-normal">모두 +2💰 / 숲 -3🌿</span>
            </button>
            <button onclick="submitAction('care')" class="bg-emerald-900 border-2 border-emerald-500 p-6 rounded-2xl text-2xl font-bold hover:bg-emerald-800">
                💖 돌보기<br><span class="text-sm text-emerald-300 font-normal">포기 0💰 / 숲 +10🌿</span>
            </button>
        </div>
        <div id="remote-waiting" class="hidden text-3xl font-bold text-indigo-400 mt-12 animate-pulse">
            🔒 선택 완료! 교실 앞 화면을 보세요.
        </div>
    </div>

    <!-- 파이어베이스 모듈 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ==========================================
           선생님의 파이어베이스 설정값을 아래에 덮어쓰세요!
           ========================================== */
        const firebaseConfig = {
           apiKey: "AIzaSyAJHyFYFVwC10Y1PMlecYCS-gerZ_HhQgo",
           authDomain: "game-of-commons.firebaseapp.com",
           projectId: "game-of-commons",
           storageBucket: "game-of-commons.firebasestorage.app",
           messagingSenderId: "532576302731",
           appId: "1:532576302731:web:116188fb7e40f6707f868e",
           measurementId: "G-DEYQX06ELY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoom = "";
        let myTeamNum = 0;
        let isTeacher = false;
        
        window.showPanel = (panelId) => {
            document.querySelectorAll('body > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(panelId).classList.remove('hidden');
            if(panelId === 'panel-dashboard') document.getElementById('panel-dashboard').classList.add('flex');
            if(panelId === 'panel-remote') document.getElementById('panel-remote').classList.add('flex');
        };

        // [진행자] 방 생성
        document.getElementById('btn-create-room').addEventListener('click', async () => {
            const roomName = document.getElementById('input-room-name').value.trim();
            const teamCount = parseInt(document.getElementById('input-team-count').value);
            if(!roomName || teamCount < 2) return alert("방 이름과 2 이상의 모둠 수를 입력하세요.");
            
            currentRoom = roomName;
            isTeacher = true;

            const initialTeams = {};
            for(let i=1; i<=teamCount; i++) {
                initialTeams[i] = { choice: null, gold: 0 };
            }

            await set(ref(db, `rooms/${currentRoom}`), {
                state: { round: 1, hp: 100, phase: 'betting' },
                teams: initialTeams
            });
            
            document.getElementById('display-room-name').innerText = roomName;
            showPanel('panel-dashboard');
            listenRoom();
        });

        // [학생] 방 접속
        document.getElementById('btn-join-room').addEventListener('click', () => {
            const roomName = document.getElementById('student-room-name').value.trim();
            const teamNum = parseInt(document.getElementById('student-team-num').value);
            if(!roomName || !teamNum) return alert("방 이름과 모둠 번호를 입력하세요.");
            
            currentRoom = roomName;
            myTeamNum = teamNum;
            document.getElementById('remote-team-name').innerText = `${teamNum}모둠`;
            
            showPanel('panel-remote');
            listenRoom();
        });

        // [학생] 행동 전송
        window.submitAction = async (choice) => {
            await update(ref(db, `rooms/${currentRoom}/teams/${myTeamNum}`), { choice: choice });
            document.getElementById('remote-buttons').classList.add('hidden');
            document.getElementById('remote-waiting').classList.remove('hidden');
        };

        // 데이터 실시간 감지 및 화면 렌더링
        function listenRoom() {
            onValue(ref(db, `rooms/${currentRoom}`), (snapshot) => {
                const data = snapshot.val();
                if(!data) return;

                // 1. 교사 대시보드 업데이트
                if(isTeacher) {
                    renderDashboard(data);
                } 
                // 2. 학생 리모컨 업데이트
                else {
                    if(data.state.phase === 'betting' && data.teams[myTeamNum].choice === null) {
                        document.getElementById('remote-buttons').classList.remove('hidden');
                        document.getElementById('remote-waiting').classList.add('hidden');
                    } else if (data.state.phase === 'reveal') {
                        document.body.classList.add('shake-screen');
                        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
                    }
                }
            });
        }

        // 교사용 화면 카드 생성 로직
        function renderDashboard(data) {
            document.getElementById('display-round').innerText = data.state.round;
            document.getElementById('hp-bar').style.width = `${Math.max(0, data.state.hp)}%`;
            document.getElementById('hp-text').innerText = data.state.hp;
            
            // 체력 바 색상 변경 경고
            document.getElementById('hp-bar').className = data.state.hp > 40 ? "h-full bg-emerald-500 transition-all duration-1000" : "h-full bg-red-600 animate-pulse transition-all duration-1000";

            const container = document.getElementById('team-cards-container');
            container.innerHTML = '';
            
            let allChosen = true;

            Object.keys(data.teams).forEach(teamNum => {
                const team = data.teams[teamNum];
                if(team.choice === null) allChosen = false;
                
                let cardHTML = '';
                if(data.state.phase === 'betting') {
                    cardHTML = team.choice 
                        ? `<div class="bg-indigo-900 rounded-xl p-8 flex flex-col items-center justify-center h-48 border border-indigo-500"><div class="text-4xl mb-2">🔒</div><div class="font-bold text-indigo-300">선택 완료</div></div>`
                        : `<div class="bg-slate-800 rounded-xl p-8 flex flex-col items-center justify-center h-48"><div class="text-slate-400 font-bold">${teamNum}모둠 대기중..</div></div>`;
                } else {
                    const icons = { greed: '😈', need: '⛏️', care: '💖' };
                    const bgColors = { greed: 'bg-red-900', need: 'bg-amber-900', care: 'bg-emerald-900' };
                    cardHTML = `<div class="${bgColors[team.choice]} rounded-xl p-4 flex flex-col items-center justify-center h-48 border-2 border-white"><div class="text-5xl mb-2">${icons[team.choice]}</div><div class="font-bold text-xl mb-2">${teamNum}모둠</div><div class="bg-black/50 px-3 py-1 rounded text-yellow-300 font-bold">${team.gold} 💰</div></div>`;
                }
                container.innerHTML += `<div>${cardHTML}</div>`;
            });

            // 결과 공개 버튼 로직
            const btnReveal = document.getElementById('btn-reveal');
            const btnNext = document.getElementById('btn-next-round');
            
            if(data.state.phase === 'betting' && allChosen) {
                btnReveal.classList.remove('hidden');
                document.getElementById('narrative-text').innerText = "모든 모둠 선택 완료! 결과를 공개하세요.";
            } else {
                btnReveal.classList.add('hidden');
            }

            if(data.state.phase === 'reveal') {
                btnNext.classList.remove('hidden');
                document.getElementById('narrative-text').innerText = "결과가 적용되었습니다.";
            } else {
                btnNext.classList.add('hidden');
            }
        }

        // 결과 공개 정산 로직 (진행자 전용)
        document.getElementById('btn-reveal').addEventListener('click', async () => {
            const snapshot = await db.ref(`rooms/${currentRoom}`).once('value');
            const data = snapshot.val();
            
            let totalHpChange = 0;
            let greedCount = 0;
            
            // 겹치면 망한다 룰 확인
            Object.values(data.teams).forEach(t => { if(t.choice === 'greed') greedCount++; });

            Object.keys(data.teams).forEach(key => {
                const choice = data.teams[key].choice;
                if(choice === 'greed') {
                    totalHpChange -= 15;
                    data.teams[key].gold += (greedCount >= 3) ? 0 : (greedCount === 2 ? 2 : 5);
                } else if(choice === 'need') {
                    totalHpChange -= 3;
                    data.teams[key].gold += 2;
                } else if(choice === 'care') {
                    totalHpChange += 10;
                }
            });

            data.state.hp += totalHpChange;
            if(data.state.hp > 100) data.state.hp = 100;
            data.state.phase = 'reveal';

            await update(ref(db, `rooms/${currentRoom}`), data);
        });

        // 다음 라운드 준비 (진행자 전용)
        document.getElementById('btn-next-round').addEventListener('click', async () => {
            const snapshot = await db.ref(`rooms/${currentRoom}`).once('value');
            const data = snapshot.val();
            
            data.state.round++;
            data.state.phase = 'betting';
            Object.keys(data.teams).forEach(key => data.teams[key].choice = null);
            
            await update(ref(db, `rooms/${currentRoom}`), data);
        });
    </script>
</body>
</html>
